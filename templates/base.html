<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShieldDesk</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    nav { background: #12355b; padding: 12px 24px; }
    nav a { color: #fff; margin-right: 18px; text-decoration: none; }
    main { max-width: 900px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 6px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; font-size: 14px; }
    th { background: #eef1f5; }
    input, select, textarea { padding: 6px; margin: 4px 0 12px; width: 100%; box-sizing: border-box; }
    button { padding: 8px 16px; background: #12355b; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <nav>
    <strong style="color:#fff;margin-right:24px;">ShieldDesk</strong>
    <a href="/requests">My requests</a>
    <a href="/requests/new">New request</a>
    <a href="/search">Help center</a>
    <a href="/admin">Admin</a>
    {% if session.get('user_id') %}
      <a href="/logout">Logout ({{ session['username'] }})</a>
    {% else %}
      <a href="/login">Login</a>
    {% endif %}
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
